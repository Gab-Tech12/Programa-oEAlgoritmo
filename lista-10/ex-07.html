<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="n1">
<input type="number" id="n2">

<button onclick="somar()">
    Somar
</button>

<p id="resultado"></p>

<script>
function somar() {
    let valor1 = document.getElementById("n1").value; 
    let valor2 = document.getElementById("n2").value; 
//cuidado com o imediatismo, lembre que a gente está pegando uma string e concatenar string não é oq queremos; 
    let numero1 = Number(valor1);
    let numero2 = Number(valor2);
    
    let total = numero1 + numero2;

    document.getElementById('resultado').innerText = "Resultado: " + total; 

}
</script>

</body>
</html>
